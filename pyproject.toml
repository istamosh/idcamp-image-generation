[project]
name = "idcamp-image-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "huggingface-hub>=1.10.1",
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "safetensors>=0.7.0",
    "transformers>=5.5.3",
    "torch",
    "torchvision",
    "torchaudio"
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }